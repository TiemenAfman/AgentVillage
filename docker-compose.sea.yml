# The sea as a Portainer stack.
#
# Deployed the way everything else on that box is: a git stack with a GitHub push webhook -
# no Actions, no polling - with the environment set in Portainer's own stack environment
# and the outside world reaching it through Nginx Proxy Manager.
#
# What this box runs is the *world*, and nothing else. Islands stay on the machines whose
# sessions they are: an islander reads ~/.claude, spawns Claude Code with full permissions
# and owns a data/ directory, and none of that is going near a public address. The sea holds
# a fleet in memory and writes nothing down, which is what makes it safe to leave out here
# and also what makes it disposable - restart it and the world reassembles itself as each
# islander reconnects.
services:
  sea:
    build:
      context: .
      dockerfile: Dockerfile.sea
    image: promptholm-sea
    container_name: promptholm-sea
    restart: unless-stopped
    ports:
      # Behind the proxy this need not be published on the host at all; it is here so the
      # stack works on its own before anybody wires up a hostname.
      - "4750:4750"
    environment:
      SEA_PORT: 4750
      SEA_NAME: ${SEA_NAME:-Promptholm}
      # Set this. Without it anybody who can reach the port can park an island and wear a
      # name. They cannot read a file or start a process - there are none here - but that is
      # a property of the design, not a reason to leave the door open.
      SEA_KEY: ${SEA_KEY:-}
    # No volumes, deliberately. There is nothing to persist, and a volume here would be an
    # invitation to start persisting something.
