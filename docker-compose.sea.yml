# The sea as a Portainer stack.
#
# Deployed the way everything else on that box is: a git stack with a GitHub push webhook -
# no Actions, no polling - with the environment set in Portainer's own stack environment
# and the outside world reaching it through Nginx Proxy Manager.
#
# What this box runs is the *world*, and nothing else. Islands stay on the machines whose
# sessions they are: an islander reads ~/.claude, spawns Claude Code with full permissions
# and owns a data/ directory, and none of that is going near a public address. The sea holds
# a fleet in memory and writes nothing down, which is what makes it safe to leave out here
# and also what makes it disposable - restart it and the world reassembles itself as each
# islander reconnects.
services:
  sea:
    build:
      context: .
      dockerfile: Dockerfile.sea
    image: promptholm-sea
    # LOCALLY built - never pulled from a registry. Without this Portainer runs
    # `docker compose pull` before a webhook redeploy, that fails with "pull access denied
    # for promptholm-sea" because the image exists in no registry, and the deploy is
    # abandoned with the old container still running. GitHub sees a 204, so it is silent.
    # The three other self-building stacks on that box carry the same line for the same
    # reason - it is that server's recorded experience, not a guess.
    pull_policy: build
    container_name: promptholm-sea
    restart: unless-stopped
    ports:
      # Behind the proxy this need not be published on the host at all; it is here so the
      # stack works on its own before anybody wires up a hostname.
      - "4750:4750"
    environment:
      SEA_PORT: 4750
      SEA_NAME: ${SEA_NAME:-Promptholm}
      # Only for a private sea. Left empty, anybody may join - an islander from the Windows
      # release, the app on a phone - and an island's claim token is still what keeps anybody
      # else from wearing its name. Set, everybody in the world shares it: each islander puts
      # it in multiplayer.sea.key, and its own page is handed it over loopback (/api/hello).
      # The phone app would then have to carry it, in plain text, in the APK.
      SEA_KEY: ${SEA_KEY:-}
      # The restart button's own key (POST /update). Set this on an open sea: without it,
      # and without SEA_KEY, the button refuses everybody. Never goes to a player.
      SEA_ADMIN_KEY: ${SEA_ADMIN_KEY:-}
      # The redeploy hook behind the button on the harbour page (GET /). Portainer's own
      # stack webhook does nicely. Leave it out and the button answers 501 instead of
      # pretending: a sea started by hand has nothing to ask. Whoever has this URL can
      # replace this container, so it belongs here and not in the repo.
      SEA_UPDATE_HOOK: ${SEA_UPDATE_HOOK:-}
    # No volumes, deliberately. There is nothing to persist, and a volume here would be an
    # invitation to start persisting something.

# ---- putting it on the box ---------------------------------------------------------
#
#   Portainer -> Stacks -> Add stack -> Repository
#     Repository URL      this repo
#     Compose path        docker-compose.sea.yml
#     Environment         SEA_NAME, SEA_KEY
#     Automatic updates   Webhook
#
# Then paste the webhook Portainer gives you into the repository's GitHub webhooks, push
# event only. That is the conventie on that box: a git stack and a push webhook, no
# Actions and no polling. Endpoint 3 (`local`) is the only environment there.
#
# Nginx Proxy Manager terminates TLS in front of it. Two things it has to be told, or the
# island connects and then sits in silence: **Websockets Support on**, and a read timeout
# longer than the sea's own 25 s ping - proxy_read_timeout 300s in the Advanced tab.
# Everything a page does after the handshake goes over that socket.
#
# The address a joiner types is the proxied one (https://..., which web/js/api.js turns
# into wss://). The published port above is for reaching it on the LAN before any of that
# is wired up, and can go once it is.
