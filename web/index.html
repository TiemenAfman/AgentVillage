<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Promptholm</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><text y='52' font-size='52'>🏝️</text></svg>">
<meta name="theme-color" content="#0d1420">
<meta name="description" content="A 3D island where the Claude agents you work with live.">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/island-192.png">
<script>
// The page reports its own errors from js/main.js - which is exactly the file that does
// not run when something in its import graph 404s. The import fails, main.js never gets
// to execute, and the boot overlay below keeps saying "Charting the island…" for as long
// as anyone cares to wait; one unnamed 404 in the console is the only trace. So this much
// has to sit out here, outside the graph it is watching.
(() => {
  const failed = [];
  // Resource errors do not bubble, so a listener without the capture flag never sees a
  // 404 on a module, a script or a stylesheet.
  addEventListener('error', (e) => {
    const el = e.target;
    if (!el || el === window || !el.tagName) return;      // a thrown error, not a resource
    const url = el.src || el.href;
    if (url) failed.push(String(url).replace(location.origin, ''));
  }, true);

  // Generous on purpose: a cold start has a lot of geometry to build before it takes the
  // overlay down, and crying wolf over a slow card is worse than staying quiet. main.js
  // sets the flag as soon as its own code runs, so this only speaks when the module graph
  // never came up at all - a 404 on a vendored file, or a syntax error in one of ours.
  setTimeout(async () => {
    if (window.__islandRunning) return;
    const boot = document.getElementById('boot');
    const text = document.getElementById('boot-text');
    if (!boot || !text || boot.hidden || boot.classList.contains('gone')) return;

    // The browser fires that error on the <script> which owns the graph rather than on
    // the import that failed, so the page can tell something broke but not what. The
    // server reads the disk and does know, so ask it before putting a name to anything.
    let missing = [];
    try {
      const r = await fetch('/api/vendor', { cache: 'no-store' });
      if (r.ok) missing = (await r.json()).missing || [];
    } catch { /* a visitor, or the island is gone - the wording below covers both */ }

    const safe = (s) => s.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
    text.innerHTML = (missing.length
      ? `The island is missing ${missing.length === 1 ? 'a file it needs' : 'files it needs'}.<br>`
        + `<span class="muted">${missing.map(safe).join('<br>')}</span><br>`
        + `<span class="muted">web/vendor is out of date in this checkout - run <b>npm run vendor</b>.</span><br>`
      : `The island's code did not load.<br>`
        + `<span class="muted">${failed.length ? `${safe(failed[0])} or one of its imports did not arrive` : 'Nothing out here knows why'} - the browser console has the error.</span><br>`)
      + `<button class="btn" id="boot-retry">Reload</button>`;
    document.getElementById('boot-retry').addEventListener('click', () => location.reload());

    // The keeper's log should carry this too, so it is findable without a browser open.
    // Only from the keeper's own machine: a visitor's trouble is not ours to write down.
    if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
      try {
        const said = missing.length ? `missing ${missing.join(', ')}` : `${failed[0] || 'the module graph'} did not load`;
        navigator.sendBeacon('/api/log', new Blob([JSON.stringify({ message: `boot stalled: ${said}` })], { type: 'application/json' }));
      } catch { /* the overlay says it either way */ }
    }
  }, 12000);
})();
</script>
<link rel="stylesheet" href="/css/ui.css">
<link rel="stylesheet" href="/css/panels.css">
<script type="importmap">
{
  "imports": {
    "three": "/vendor/three.module.js",
    "three/addons/": "/vendor/addons/",
    "shared/": "/shared/"
  }
}
</script>
</head>
<body>
<canvas id="stage"></canvas>

<!-- The panels that stand on the island: real HTML, transformed into the scene by
     web/js/panels.js. Here rather than made in script so its place in the stacking
     order - over the canvas, under the UI - is written down where it can be seen. -->
<div id="panels"></div>

<div id="boot" class="boot"><div class="boot-inner"><div class="boot-mark">🏝️</div><div id="boot-text">Charting the island…</div></div></div>

<header class="card titlecard" id="titlecard" hidden>
  <div class="row">
    <h1 id="island-name">Promptholm</h1>
    <span class="live" id="live-dot" title="Live"><i></i><span id="live-text">Live</span></span>
  </div>
  <div class="muted" id="founded">—</div>
  <div class="counts" id="counts"></div>
</header>

<div class="topright" id="topright" hidden>
  <button class="chip" id="clock-chip" title="Time of day on the island">—</button>
  <div class="chips">
    <button class="chip on" data-filter="code">Code</button>
    <button class="chip on" data-filter="cowork">Cowork</button>
    <button class="chip on" data-filter="apprentices">Apprentices</button>
  </div>
  <div class="chips">
    <button class="chip" id="found-btn" title="Start a new session on the island">New settler</button>
    <button class="chip" id="walk-btn" title="Walk the island on foot">Walk</button>
    <button class="chip" id="build-btn" title="Put something on the island">Build</button>
    <button class="chip" id="avatar-btn" title="Compose the settler you walk as">Avatar</button>
    <button class="chip" id="legend-btn">Legend</button>
    <button class="chip" id="reset-btn" title="Frame the whole island">Overview</button>
  </div>
</div>

<div class="right-column" id="right-column">
  <section class="card waiting-now" id="waiting-now" hidden>
    <h2 id="waiting-head">Waiting for you</h2>
    <ul id="waiting-list"></ul>
  </section>

  <section class="card building-now" id="building-now" hidden>
    <h2>Now building</h2>
    <ul id="building-list"></ul>
  </section>
</div>

<aside class="panel" id="legend" hidden>
  <div class="panel-head"><h2>Legend</h2><button class="x" data-close="legend">✕</button></div>
  <div class="panel-body" id="legend-body"></div>
</aside>

<aside class="panel" id="dossier" hidden>
  <div class="panel-head"><h2 id="dossier-name">—</h2><button class="x" data-close="dossier">✕</button></div>
  <div class="panel-body" id="dossier-body"></div>
</aside>

<footer class="card chronicle" id="chronicle" hidden>
  <button class="play" id="play-btn" title="Replay the growth of the village">▶</button>
  <input type="range" id="chronicle-range" min="0" max="1000" value="1000" step="1">
  <div class="chronicle-meta">
    <span id="chronicle-date">—</span>
    <select id="chronicle-speed" title="Replay speed">
      <option value="hour">1 hour / second</option>
      <option value="day" selected>1 day / second</option>
      <option value="whole">Whole story in 20 s</option>
    </select>
    <button class="chip" id="live-btn">Live</button>
  </div>
</footer>

<div class="walk-hud" id="walk-hud" hidden>
  <div class="card walk-prompt" id="walk-prompt" hidden></div>
  <div class="card walk-confirm" id="walk-confirm" hidden></div>
  <div class="card walk-pouch" id="walk-pouch" hidden></div>
  <div class="walk-keys" id="walk-keys"></div>
</div>

<!-- What is in your hand while building. Outside the walk HUD on purpose: that strip is
     hidden whenever you are not on foot, and a ghost can be aimed from the sky too. -->
<div class="card build-hud" id="build-hud" hidden></div>

<div id="veil"></div>

<div class="fabs" id="fabs">
  <button class="fab" id="install-btn" title="Install the island as an app" aria-label="Install the island as an app" hidden>
    <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 3v12M7 11l5 5 5-5M4 20h16"/>
    </svg>
  </button>
  <button class="fab" id="fullscreen-btn" title="Fullscreen" aria-label="Fullscreen">
    <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" data-icon="expand">
      <path d="M8 3H3v5M16 3h5v5M16 21h5v-5M8 21H3v-5"/>
    </svg>
    <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" data-icon="collapse" hidden>
      <path d="M3 8h5V3M21 8h-5V3M21 16h-5v5M3 16h5v5"/>
    </svg>
  </button>
</div>

<div id="labels"></div>
<div id="toasts"></div>
<div id="hover-label" class="hover-label" hidden></div>

<script type="module" src="/js/main.js"></script>
</body>
</html>
