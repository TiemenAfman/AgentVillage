<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Promptholm</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><text y='52' font-size='52'>🏝️</text></svg>">
<meta name="theme-color" content="#0d1420">
<meta name="description" content="A 3D island where the Claude agents you work with live.">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/island-192.png">
<link rel="stylesheet" href="/css/ui.css">
<script type="importmap">
{
  "imports": {
    "three": "/vendor/three.module.js",
    "three/addons/": "/vendor/addons/",
    "shared/": "/shared/"
  }
}
</script>
</head>
<body>
<canvas id="stage"></canvas>

<div id="boot" class="boot"><div class="boot-inner"><div class="boot-mark">🏝️</div><div id="boot-text">Charting the island…</div></div></div>

<header class="card titlecard" id="titlecard" hidden>
  <div class="row">
    <h1 id="island-name">Promptholm</h1>
    <span class="live" id="live-dot" title="Live"><i></i><span id="live-text">Live</span></span>
  </div>
  <div class="muted" id="founded">—</div>
  <div class="counts" id="counts"></div>
</header>

<div class="topright" id="topright" hidden>
  <button class="chip" id="clock-chip" title="Time of day on the island">—</button>
  <div class="chips">
    <button class="chip on" data-filter="code">Code</button>
    <button class="chip on" data-filter="cowork">Cowork</button>
    <button class="chip on" data-filter="apprentices">Apprentices</button>
  </div>
  <div class="chips">
    <button class="chip" id="found-btn" title="Start a new session on the island">New settler</button>
    <button class="chip" id="walk-btn" title="Walk the island on foot">Walk</button>
    <button class="chip" id="legend-btn">Legend</button>
    <button class="chip" id="reset-btn" title="Frame the whole island">Overview</button>
  </div>
</div>

<section class="card building-now" id="building-now" hidden>
  <h2>Now building</h2>
  <ul id="building-list"></ul>
</section>

<aside class="panel" id="legend" hidden>
  <div class="panel-head"><h2>Legend</h2><button class="x" data-close="legend">✕</button></div>
  <div class="panel-body" id="legend-body"></div>
</aside>

<aside class="panel" id="dossier" hidden>
  <div class="panel-head"><h2 id="dossier-name">—</h2><button class="x" data-close="dossier">✕</button></div>
  <div class="panel-body" id="dossier-body"></div>
</aside>

<footer class="card chronicle" id="chronicle" hidden>
  <button class="play" id="play-btn" title="Replay the growth of the village">▶</button>
  <input type="range" id="chronicle-range" min="0" max="1000" value="1000" step="1">
  <div class="chronicle-meta">
    <span id="chronicle-date">—</span>
    <select id="chronicle-speed" title="Replay speed">
      <option value="hour">1 hour / second</option>
      <option value="day" selected>1 day / second</option>
      <option value="whole">Whole story in 20 s</option>
    </select>
    <button class="chip" id="live-btn">Live</button>
  </div>
</footer>

<div class="walk-hud" id="walk-hud" hidden>
  <div class="card walk-prompt" id="walk-prompt" hidden></div>
  <div class="card walk-confirm" id="walk-confirm" hidden></div>
  <div class="walk-keys" id="walk-keys"></div>
</div>

<div id="labels"></div>
<div id="toasts"></div>
<div id="hover-label" class="hover-label" hidden></div>

<script type="module" src="/js/main.js"></script>
</body>
</html>
