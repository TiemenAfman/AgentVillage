[package]
name = "promptholm"
version = "0.4.0"
description = "Promptholm as its own window: a shell around serve.mjs, see Plans/eiland-als-desktop-app.md"
authors = ["Martijn Jansen"]
edition = "2021"
# Two binaries: the window (src/main.rs) and the islander (src/bin/promptholm-island.rs).
# The window is the one `tauri dev` / `tauri build` run and bundle.
default-run = "promptholm"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "promptholm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The islander exe's tray and event loop - the same crates Tauri draws its own with, so
# already in the lockfile; used directly so that exe links neither Tauri nor WebView2.
tray-icon = "0.24"
tao = "0.35"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_Security", "Win32_UI_WindowsAndMessaging"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
