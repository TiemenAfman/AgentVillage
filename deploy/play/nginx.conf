# The web version's shelf (Plans/spelen-in-de-browser.md, Dockerfile.play).
#
#   /play/              the door (index.html) and version.json: no-cache, they are what changes
#   /play/<id>/...      one build, never changed once out: cached for a year, immutable
#
# Everything worth it is compressed ahead of time by scripts/pack-web.mjs (x.js.gz beside x.js),
# so gzip_static serves it without the home server spending a CPU on it; gzip covers the rest.
# Behind Nginx Proxy Manager, as a Custom Location /play on the open sea's host or a host of its
# own - with NPM's "Cache Assets" off, since these headers are the ones that are meant.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  gzip_static on;
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types application/javascript text/css application/json image/svg+xml application/manifest+json model/gltf-binary;

  location = / { return 302 /play/; }

  location = /play/ {
    add_header Cache-Control "no-cache" always;
    try_files /play/index.html =404;
  }
  location = /play/index.html { add_header Cache-Control "no-cache" always; }
  location = /play/version.json { add_header Cache-Control "no-cache" always; }

  location /play/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    # shared/ is ES modules, and a module served as anything but JavaScript is refused.
    location ~ \.mjs$ {
      types { }
      default_type application/javascript;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location ~ \.glb$ {
      types { }
      default_type model/gltf-binary;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }
  }
}
