# Publishes site/ - the landing page for promptholm.com - to GitHub Pages.
#
# Runs when site/ changes on main, or by hand. Two things have to be set once outside the
# repository before it serves anything: Settings -> Pages -> Source "GitHub Actions" (and the
# custom domain promptholm.com there; site/CNAME carries the same name for anyone reading the
# folder), and DNS for promptholm.com pointing at GitHub Pages.
#
# The page has no build step, like the island itself: what is in site/ is what is served. Its
# download buttons point at releases/latest/download/<asset>, so a new tag needs no change here.
name: site

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/site.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
