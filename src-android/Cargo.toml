[package]
name = "promptholm-android"
version = "0.5.0"
description = "Promptholm on a phone: web/ carried inside the app, joining one sea - see Plans/eiland-op-android.md"
authors = ["Martijn Jansen"]
edition = "2021"

# Its own crate rather than a target of src-tauri: that one is two Windows exes around an
# islander (tray-icon, tao, windows-sys, node as a child), and none of it exists on a phone.
[lib]
name = "promptholm_android_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Links out of the island (a new release, a Jira ticket) go to the phone's browser, and
# the new APK is handed to Android's installer through the same plugin.
tauri-plugin-opener = "2"
# Fetching that APK (install_update below). rustls rather than the system OpenSSL: nothing
# to cross-compile for aarch64-linux-android, and the page cannot fetch it itself - it sits
# on tauri.localhost and GitHub sends no CORS header with a release asset.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
