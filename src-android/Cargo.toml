[package]
name = "promptholm-android"
version = "0.10.5"
description = "Promptholm on a phone: web/ carried inside the app, joining one sea - see Plans/eiland-op-android.md"
authors = ["Martijn Jansen"]
edition = "2021"

# Its own crate rather than a target of src-tauri: that one is two Windows exes around an
# islander (tray-icon, tao, windows-sys, node as a child), and none of it exists on a phone.
[lib]
name = "promptholm_android_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Links out of the island (a new release and its APK, a Jira ticket) go to the phone's browser.
tauri-plugin-opener = "2"
# latest_release, which reads the newest release's tag from the GitHub API. rustls rather than
# the system OpenSSL: nothing to cross-compile for aarch64-linux-android, and the page cannot
# ask itself - it sits on tauri.localhost and GitHub's API is not reached from there by fetch.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde_json = "1"
# The page bundle (src/bundle.rs): its signature, its hash and unpacking it. Pure Rust, nothing
# to cross-compile; verify-only ed25519, deflate only.
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
